# Run by hand: can GitHub's servers reach RIK? Lists the rounds RIK offers and changes nothing.
name: probe

on:
  workflow_dispatch:
    inputs:
      register:
        description: "Also list what RIK's register of commissions' documents holds for local elections"
        type: boolean
        default: false
      reports:
        description: "With register: fetch each commission's total report and give its shape (pages, text layer, rows of figures)"
        type: boolean
        default: false

permissions: {}  # each job asks for what it needs

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: List RIK's rounds
        env:
          REGISTER: ${{ inputs.register }}
          REPORTS: ${{ inputs.reports }}
        run: |
          pip install uv==0.13.9 && uv sync --frozen
          uv run izbori rounds
          if [ "$REPORTS" = "true" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-srp tesseract-ocr-srp-latn poppler-utils >/dev/null
            uv run --with "numpy==2.5.5" --with "opencv-python-headless==5.1.0.95" izbori register --reports
          elif [ "$REGISTER" = "true" ]; then uv run izbori register; fi
