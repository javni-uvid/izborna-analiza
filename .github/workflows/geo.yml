# Geo: municipal boundaries for the map on the Explore page, from OpenStreetMap (ODbL), joined to RIK's
# municipalities by the cadastre's municipality code that OpenStreetMap carries. Boundaries rarely change, so this
# runs only when started by hand; it commits data/geo/municipalities.json (or, with `settlements`, the settlements'
# boundaries at admin_level 9 into data/geo/settlements.json) and starts the pages workflow.
name: geo

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the boundaries"
        type: boolean
        default: true
      inspect:
        description: "Only list what the dataset of Kosovo's municipalities holds"
        type: boolean
        default: false
      kim:
        description: "Only add Kosovo and Metohija's municipalities, in RIK's division"
        type: boolean
        default: false
      settlements:
        description: "Only the settlements' boundaries (admin_level 9), into data/geo/settlements.json"
        type: boolean
        default: false
      quarters:
        description: "A settlement by its quarters: code=Cyrillic name (89010=Нови Сад); without commit only lists them"
        type: string
        default: ""

permissions: {}  # each job asks for what it needs

concurrency:
  group: geo
  cancel-in-progress: false

jobs:
  geo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # commit the boundaries
      actions: write   # start the pages workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install uv==0.13.9 && uv sync --frozen
      - name: Fetch the boundaries
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          INSPECT: ${{ inputs.inspect }}
          KIM: ${{ inputs.kim }}
          SETTLEMENTS: ${{ inputs.settlements }}
          QUARTERS: ${{ inputs.quarters }}
        run: |
          if [ -n "$QUARTERS" ] && [ "$COMMIT" != "true" ]; then
            uv run izbori geo --quarters-inspect "${QUARTERS#*=}"
            exit 0
          fi
          if [ "$INSPECT" = "true" ]; then
            uv run --with "pyshp==3.1.9" izbori geo --kim-inspect
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=()
          [ "$KIM" = "true" ] && args+=(--kim)
          [ "$SETTLEMENTS" = "true" ] && args+=(--settlements)
          [ -n "$QUARTERS" ] && args+=(--quarters "$QUARTERS")
          [ "$COMMIT" = "true" ] && args+=(--commit --push --dispatch-pages)
          uv run --with "shapely==2.2.0" --with "pyshp==3.1.9" izbori geo "${args[@]}"
