# Weekly: look at the municipalities' own sites (data/municipal_sites.csv) for the electoral commissions' documents
# and keep the links found (data/municipal_docs.json). The log names the new ones; a decision on polling stations is a
# candidate for data/station_lists.csv.
name: watch

on:
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:
    inputs:
      only:
        description: "Only these municipalities (codes, comma-separated)"
        default: ""
      others_only:
        description: "Skip the domains themselves; try only their other spellings (.rs, .org.rs, .ls.gov.rs, .gov.rs)"
        type: boolean
        default: false

permissions: {}  # each job asks for what it needs

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write  # commit the links found
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install uv==0.13.9 && uv sync --frozen
      - name: Look at the sites
        env:
          ONLY: ${{ inputs.only }}
          OTHERS_ONLY: ${{ inputs.others_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=(--commit --push)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$OTHERS_ONLY" = "true" ] && args+=(--others-only)
          uv run izbori watch "${args[@]}"
