# Build the site and publish it to GitHub Pages. Runs on every push to main by a person, and when the
# update workflow archived something new (its own pushes don't trigger workflows, so it starts this one).
# The build is incremental: see the cache steps below.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}  # each job asks for what it needs

concurrency:
  group: pages
  cancel-in-progress: false  # a newer run waits for the current deploy instead of cutting it off

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read  # configure-pages reads the Pages settings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      # The previous build and its fingerprints: only pages whose data changed are rendered again (on election
      # night that is the round being counted). Changed code or templates rebuild everything.
      - name: Restore the previous build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            _site
            _site.state.json
          key: site-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-
      - name: Build
        env:
          # Cloudflare Web Analytics' site token, public by design (every page shows it): with it every page loads
          # the counting script (principle 5's exception, 22 Nov 2026); without it, none
          IZBORI_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_SITE_TOKEN }}
        run: |
          pip install uv==0.13.9 && uv sync --frozen
          uv run izbori site --out _site --incremental
          du -sh --apparent-size _site
      - name: Keep this build for the next one
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            _site
            _site.state.json
          key: site-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write     # publish
      id-token: write  # prove the publishing is this repository's
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        with:
          # GitHub sometimes takes over 10 minutes "syncing files" (three deploys on 9 Nov 2026 timed out at the
          # default 10 minutes, while the deploys around them took under 3)
          timeout: 1800000
      # The site stands behind Cloudflare's proxy (22 Nov 2026), which may keep its files: told after each publishing
      # to forget them, so the new ones are served at once. Without the token or the zone's id: skipped. A failure
      # is only a warning: the pages are published either way, and the cache forgets them by itself.
      - name: Tell the cache the site changed
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          # A value pasted with a line break at its end ends curl's headers early and the body goes missing (code
          # 1012, "Request must contain one of purge_everything…"): the spaces and breaks around them go.
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]'); ZONE=$(printf '%s' "$ZONE" | tr -d '[:space:]')
          if [ -z "$TOKEN" ] || [ -z "$ZONE" ]; then echo "::notice::cache not purged: no token or zone id"; exit 0; fi
          for i in 1 2 3; do
            got=$(curl -sS --max-time 30 -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/purge_cache" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' | head -c 300) || true
            case "$got" in *'"success":true'*) echo "cache purged: the whole zone"; exit 0;; esac
            sleep 10
          done
          echo "::warning::cache not purged: $got"
