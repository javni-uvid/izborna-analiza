# Controllers: read RIK's decisions on extended polling boards with OCR and keep, per polling station, which
# lists appointed a member. Daily, only new decisions are read. Names in the decisions are never stored or logged.
#
# Three steps, so that four jobs read at once: plan indexes RIK's register and lists what to read; read (four
# jobs) each read their share with OCR; merge keeps the index and every part in the round's store and commits
# once. With nothing to read, merge still keeps what the register lists (links, kinds). Then each station is joined
# to its settlement in the 2022 census again, since the decisions give the addresses (a commit of its own when
# that changed).
name: boards

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      round:
        description: "Round id (empty: the newest round RIK lists)"
        default: ""
      minutes:
        description: "Stop starting new decisions after this many minutes"
        default: "320"
      limit:
        description: "Read at most this many decisions per job (empty: all)"
        default: ""
      commit:
        description: "Commit the results"
        type: boolean
        default: true
      retry:
        description: "Read again the decisions that couldn't be read"
        type: boolean
        default: false
      reindex:
        description: "Page through the whole register again, to place every decision by the current rules"
        type: boolean
        default: false
      only:
        description: "Read only these municipalities' decisions (codes, comma-separated), e.g. to see a layout"
        default: ""
      reread:
        description: "With only: read those municipalities' decisions again, even those already read"
        type: boolean
        default: false
      ids:
        description: "Only log how these decisions read (ids, comma-separated, with round), names masked; nothing is kept"
        default: ""

permissions: {}  # each job asks for what it needs

concurrency:
  group: boards
  cancel-in-progress: false

jobs:
  diagnose:
    if: inputs.ids != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install OCR
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-srp tesseract-ocr-srp-latn poppler-utils
      - name: Install
        run: pip install uv==0.13.9 && uv sync --frozen
      - name: Read the decisions every way, names masked
        env:
          ROUND: ${{ inputs.round }}
          IDS: ${{ inputs.ids }}
        run: uv run izbori boards --round "$ROUND" --diagnose-ids "$IDS"

  plan:
    if: inputs.ids == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      planned: ${{ steps.plan.outputs.planned }}
      todo: ${{ steps.plan.outputs.todo }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install uv==0.13.9 && uv sync --frozen
      - name: Index the register and list what to read
        id: plan
        env:
          ROUND: ${{ inputs.round }}
          RETRY: ${{ inputs.retry }}
          REINDEX: ${{ inputs.reindex }}
          ONLY: ${{ inputs.only }}
          REREAD: ${{ inputs.reread }}
        run: |
          args=(--plan plan.json)
          [ -n "$ROUND" ] && args+=(--round "$ROUND")
          [ "$RETRY" = "true" ] && args+=(--retry-unparsed)
          [ "$REINDEX" = "true" ] && args+=(--reindex)
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$REREAD" = "true" ] && args+=(--reread)
          uv run izbori boards "${args[@]}"
          if [ -f plan.json ]; then
            echo "planned=true" >> "$GITHUB_OUTPUT"
            echo "todo=$(python3 -c 'import json; print(len(json.load(open("plan.json"))["todo"]))')" >> "$GITHUB_OUTPUT"
          else
            echo "planned=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: steps.plan.outputs.planned == 'true'
        with:
          name: plan
          path: plan.json
          retention-days: 3

  read:
    needs: plan
    if: needs.plan.outputs.planned == 'true' && needs.plan.outputs.todo != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install OCR
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-srp tesseract-ocr-srp-latn poppler-utils
      - name: Install
        run: pip install uv==0.13.9 && uv sync --frozen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: plan
      - name: Read this job's share
        env:
          SHARD: ${{ matrix.shard }}
          MINUTES: ${{ inputs.minutes || '320' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(--read plan.json --shard "$SHARD/4" --out "part-$SHARD.json" --budget-minutes "$MINUTES" --diagnose 4)
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          uv run izbori boards "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: part-${{ matrix.shard }}
          path: part-${{ matrix.shard }}.json
          retention-days: 3
          if-no-files-found: ignore

  merge:
    needs: [plan, read]
    if: always() && needs.plan.outputs.planned == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # commit the decisions read
      actions: write   # start the pages workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: pip install uv==0.13.9 && uv sync --frozen
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: "*"
          merge-multiple: true
      - name: Keep the index and the parts read
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event_name == 'schedule' || inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob  # with nothing to read there are no parts
          args=(--merge plan.json --show 15)
          [ "$COMMIT" = "true" ] && args+=(--commit --push --dispatch-pages)
          uv run izbori boards "${args[@]}" part-*.json
      - name: Join the stations to their census settlements (the addresses may have changed)
        env:
          COMMIT: ${{ github.event_name == 'schedule' || inputs.commit }}
        run: |
          args=()
          [ "$COMMIT" = "true" ] && args+=(--commit --push)
          uv run izbori settlements "${args[@]}"
